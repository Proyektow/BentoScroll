<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f4f4f2" />
  <title>BENTOSCROLL — Suite Local</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- VISTA 1: FEED -->
  <section id="view-feed" class="view active">
    <header class="hud">
      <div class="progress-track" id="progress-track"></div>
      <div class="hud-row">
        <div class="hud-brand">
          <!-- Logo exacto BENTOKIT -->
          <svg class="bentokit-logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="1" width="38" height="38" fill="#ffffff" stroke="#111111" stroke-width="2"/>
            <rect x="6" y="6" width="12" height="12" fill="#ffffff" stroke="#111111" stroke-width="2"/>
            <rect x="22" y="6" width="12" height="12" fill="#111111"/>
            <rect x="6" y="22" width="12" height="12" fill="#ffffff" stroke="#111111" stroke-width="2"/>
            <rect x="22" y="22" width="12" height="12" fill="#c0392b"/>
          </svg>
          <div class="brand-text">
            <span class="brand-name"><span class="accent-red">BENTO</span>SCROLL</span>
            <span class="brand-sub" id="stat-seen">0 LEÍDAS · OFFLINE</span>
          </div>
        </div>
        <div class="hud-actions">
          <button id="btn-sync" class="hud-box-btn" title="Descargar nuevas píldoras con red">
            <span id="sync-label">RED +</span>
          </button>
          <button id="btn-shuffle" class="hud-box-btn" title="Mezclar feed" aria-label="Mezclar">↻</button>
        </div>
      </div>
    </header>
    <main id="feed" class="feed-container"></main>
  </section>

  <!-- VISTA 2: MAPA DE NIEBLA (CIUDAD REAL + ZOOM) -->
  <section id="view-fog" class="view">
    <div class="module-shell">
      <header class="sub-header">
        <div>
          <h1 class="sub-title"><span class="accent-red">BENTO</span> NIEBLA</h1>
          <p class="sub-desc" id="fog-stats">0 ZONAS DESPEJADAS · GPS LOCAL</p>
        </div>
        <button id="btn-fog-gps" class="status-badge gps">RED/GPS</button>
      </header>

      <div class="canvas-bento-box">
        <canvas id="fog-canvas"></canvas>
        <div class="map-zoom-controls">
          <button id="btn-fog-zoom-in" class="zoom-btn" aria-label="Ampliar mapa">+</button>
          <button id="btn-fog-zoom-out" class="zoom-btn" aria-label="Alejar mapa">−</button>
        </div>
        <div id="fog-pin-preview" class="fog-pin-card hidden"></div>
      </div>

      <div class="bento-footer">
        <button id="btn-fog-center" class="action-btn">CENTRAR EN MI POSICIÓN</button>
      </div>
    </div>
  </section>

  <!-- VISTA 3: ESCÁNER SENSORIAL -->
  <section id="view-scanner" class="view">
    <div class="scanner-shell">
      <header class="sub-header">
        <div>
          <h1 class="sub-title"><span class="accent-red">BENTO</span> ÓPTICA</h1>
          <p class="sub-desc">ALMACENAMIENTO 100% PRIVADO EN APP</p>
        </div>
        <button id="btn-flip-cam" class="hud-box-btn">GIRAR</button>
      </header>

      <div class="viewfinder-box">
        <canvas id="cam-canvas"></canvas>
        <video id="cam-video" playsinline autoplay muted style="display:none"></video>
        <div id="cam-overlay-msg" class="cam-msg">INICIANDO SENSOR ÓPTICO...</div>
      </div>

      <div class="palette-bar" id="live-palette"></div>

      <div class="filter-pills" id="filter-selector">
        <button class="f-pill active" data-filter="normal">COLOR</button>
        <button class="f-pill" data-filter="1bit">1-BIT</button>
        <button class="f-pill" data-filter="thermal">TÉRMICO</button>
        <button class="f-pill" data-filter="ascii">ASCII</button>
      </div>

      <button id="btn-shutter" class="shutter-btn">CAPTURAR EN BÓVEDA</button>
    </div>
  </section>

  <!-- VISTA 4: LAB FÍSICA TÁCTIL -->
  <section id="view-lab" class="view">
    <div class="module-shell">
      <header class="sub-header">
        <div>
          <h1 class="sub-title"><span class="accent-red">BENTO</span> LAB</h1>
          <p class="sub-desc">FÍSICA TÁCTIL Y SONIDO LOCAL</p>
        </div>
        <div class="segmented-tabs">
          <button class="l-tab active" data-ltab="particles">FLUIDOS</button>
          <button class="l-tab" data-ltab="sound">ONDAS</button>
        </div>
      </header>

      <div class="canvas-bento-box">
        <canvas id="lab-canvas"></canvas>
      </div>

      <div class="bento-footer">
        <button id="btn-lab-mode" class="action-btn">POLARIDAD: ATRACCIÓN</button>
        <button id="btn-lab-clear" class="action-btn">REINICIAR</button>
      </div>
    </div>
  </section>

  <!-- VISTA 5: BÓVEDA PRIVADA -->
  <section id="view-vault" class="view">
    <div class="vault-shell">
      <header class="sub-header">
        <div>
          <h1 class="sub-title"><span class="accent-red">BENTO</span> BÓVEDA</h1>
          <p class="sub-desc" id="vault-summary">0 CAPTURAS · 0 PÍLDORAS</p>
        </div>
        <div class="segmented-tabs">
          <button class="v-tab active" data-vtab="captures">CAPTURAS</button>
          <button class="v-tab" data-vtab="sparks">PÍLDORAS</button>
        </div>
      </header>
      <div id="vault-grid" class="vault-grid"></div>
    </div>
  </section>

  <!-- MODAL DETALLE DE CAPTURA -->
  <div id="capture-modal" class="modal hidden">
    <div class="modal-card">
      <img id="modal-img" alt="Captura privada" />
      <div id="modal-palette" class="palette-bar"></div>
      <div class="modal-meta" id="modal-meta"></div>
      <div class="bento-footer">
        <button id="modal-delete" class="action-btn danger-btn">BORRAR</button>
        <button id="modal-share" class="action-btn">COMPARTIR</button>
        <button id="modal-close" class="action-btn red-btn">CERRAR</button>
      </div>
    </div>
  </div>

  <!-- BARRA DE NAVEGACIÓN INFERIOR -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-target="view-feed">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="11"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="18" width="7" height="3"/></svg>
      <span>FEED</span>
    </button>
    <button class="nav-item" data-target="view-fog">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
      <span>NIEBLA</span>
    </button>
    <button class="nav-item center-action" data-target="view-scanner" aria-label="Escáner">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
    <button class="nav-item" data-target="view-lab">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49"/></svg>
      <span>LAB</span>
    </button>
    <button class="nav-item" data-target="view-vault">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
      <span>BÓVEDA</span>
    </button>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
