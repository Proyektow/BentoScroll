<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f4f6f9" />
  <title>BentoScroll — Macro-App Local</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- VISTA 1: FEED -->
  <section id="view-feed" class="view active">
    <header class="hud">
      <div class="progress-track" id="progress-track"></div>
      <div class="hud-row">
        <div class="hud-brand">
          <div class="logo-grid">
            <span class="b-blue"></span>
            <span class="b-orange"></span>
            <span class="b-dark"></span>
            <span class="b-blue"></span>
          </div>
          <span>BentoScroll</span>
        </div>
        <div class="hud-stats">
          <span class="badge blue" id="stat-seen">0 leídas</span>
          <button id="btn-shuffle" class="icon-btn" title="Mezclar">↻</button>
        </div>
      </div>
    </header>
    <main id="feed" class="feed-container"></main>
  </section>

  <!-- VISTA 2: MAPA DE NIEBLA (FASE 4) -->
  <section id="view-fog" class="view">
    <div class="module-shell">
      <header class="sub-header">
        <div>
          <h1 class="sub-title">Mapa de Niebla</h1>
          <p class="sub-desc" id="fog-stats">0 zonas despejadas · GPS Local</p>
        </div>
        <button id="btn-fog-gps" class="pill-btn">Activar GPS</button>
      </header>

      <div class="canvas-bento-box">
        <canvas id="fog-canvas"></canvas>
        <div id="fog-pin-preview" class="fog-pin-card hidden"></div>
      </div>

      <div class="bento-footer">
        <button id="btn-fog-center" class="action-btn blue-btn">Centrar radar</button>
        <button id="btn-fog-sim" class="action-btn orange-btn">Simular paso (Prueba)</button>
      </div>
    </div>
  </section>

  <!-- VISTA 3: ESCÁNER SENSORIAL (FASE 2) -->
  <section id="view-scanner" class="view">
    <div class="scanner-shell">
      <header class="sub-header">
        <div>
          <h1 class="sub-title">Escáner Sensorial</h1>
          <p class="sub-desc">100% privado · Vinculado a tu Mapa</p>
        </div>
        <button id="btn-flip-cam" class="pill-btn">Girar cámara</button>
      </header>

      <div class="viewfinder-box">
        <canvas id="cam-canvas"></canvas>
        <video id="cam-video" playsinline autoplay muted style="display:none"></video>
        <div id="cam-overlay-msg" class="cam-msg">Iniciando sensor óptico...</div>
      </div>

      <div class="palette-bar" id="live-palette"></div>

      <div class="filter-pills" id="filter-selector">
        <button class="f-pill active" data-filter="normal">Color + Paleta</button>
        <button class="f-pill" data-filter="1bit">Game Boy 1-Bit</button>
        <button class="f-pill" data-filter="thermal">Térmico</button>
        <button class="f-pill" data-filter="ascii">ASCII Matriz</button>
      </div>

      <button id="btn-shutter" class="shutter-btn">Capturar en Bóveda</button>
    </div>
  </section>

  <!-- VISTA 4: LAB FÍSICA TÁCTIL (FASE 3) -->
  <section id="view-lab" class="view">
    <div class="module-shell">
      <header class="sub-header">
        <div>
          <h1 class="sub-title">Lab Táctil</h1>
          <p class="sub-desc">Toca o desliza · Física y sonido generativo</p>
        </div>
        <div class="vault-tabs">
          <button class="l-tab active" data-ltab="particles">Fluidos</button>
          <button class="l-tab" data-ltab="sound">Ondas</button>
        </div>
      </header>

      <div class="canvas-bento-box">
        <canvas id="lab-canvas"></canvas>
      </div>

      <div class="bento-footer">
        <button id="btn-lab-mode" class="action-btn blue-btn">Polaridad: Atracción</button>
        <button id="btn-lab-clear" class="action-btn">Reiniciar lienzo</button>
      </div>
    </div>
  </section>

  <!-- VISTA 5: BÓVEDA PRIVADA -->
  <section id="view-vault" class="view">
    <div class="vault-shell">
      <header class="sub-header">
        <div>
          <h1 class="sub-title">Bóveda Local</h1>
          <p class="sub-desc" id="vault-summary">0 capturas · 0 píldoras</p>
        </div>
        <div class="vault-tabs">
          <button class="v-tab active" data-vtab="captures">Capturas</button>
          <button class="v-tab" data-vtab="sparks">Píldoras</button>
        </div>
      </header>
      <div id="vault-grid" class="vault-grid"></div>
    </div>
  </section>

  <!-- MODAL DETALLE DE CAPTURA -->
  <div id="capture-modal" class="modal hidden">
    <div class="modal-card">
      <img id="modal-img" alt="Captura privada" />
      <div id="modal-palette" class="palette-bar"></div>
      <div class="modal-meta" id="modal-meta"></div>
      <div class="bento-footer">
        <button id="modal-delete" class="action-btn danger-btn">Borrar</button>
        <button id="modal-share" class="action-btn blue-btn">Compartir / Exportar</button>
        <button id="modal-close" class="action-btn orange-btn">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- BARRA DE NAVEGACIÓN INFERIOR -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-target="view-feed">
      <span class="nav-icon">⊞</span>
      <span>Feed</span>
    </button>
    <button class="nav-item" data-target="view-fog">
      <span class="nav-icon">◈</span>
      <span>Niebla</span>
    </button>
    <button class="nav-item center-action" data-target="view-scanner" aria-label="Escáner">
      <span class="nav-icon">◉</span>
    </button>
    <button class="nav-item" data-target="view-lab">
      <span class="nav-icon">∿</span>
      <span>Lab</span>
    </button>
    <button class="nav-item" data-target="view-vault">
      <span class="nav-icon">▤</span>
      <span>Bóveda</span>
    </button>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
